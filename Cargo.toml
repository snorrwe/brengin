[package]
name = "brengin"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["audio", "tracing", "assets-stats"]
audio = ["dep:kira"]
tracing = ["dep:tracing", "cecs/tracing"]
assets-stats = []

[dependencies]
tracing = { version = "0.1.44", optional = true }
cecs = { git = "https://github.com/snorrwe/cecs", default-features = false, features = [
    "parallel",
] }
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
fastrand = "2.5.0"
glam = { version = "0.33.5", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
smallvec = "1.15.2"
wgpu = "30.0.1"
winit = "0.30"
kira = { version = "0.12", optional = true }
instant = { version = "0.1.13", features = [] }
pollster = "1.0.1"
parking_lot = "0.12.5"
tiny-skia = "0.12.0"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel", "nightly"] }
thiserror = "2.0.20"
guillotiere = "0.7.0"
async-lock = "3.4.2"
serde_json = "1.0.151"
serde = "1.0.229"
serde_derive = "1.0.229"
cfg-if = "1.0.4"
harfrust = "0.13.2"
read-fonts = "0.43.3"
skrifa = "0.46.2"
clipboard-rs = "0.3.5"

[dev-dependencies]
clap = "4.6.6"
clap_derive = "4.6.4"
tracing-subscriber = "0.3.23"

[[example]]
name = "boids"
